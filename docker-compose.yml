# ============================================================
# docker-compose.yml — Full Stack Deployment
# ============================================================
version: "3.9"

services:

  # ── PostgreSQL Database ──────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: apex_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       apex_trading
      POSTGRES_USER:     apex_user
      POSTGRES_PASSWORD: apex_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apex_user -d apex_trading"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis (session cache, WebSocket pub/sub) ─────────────
  redis:
    image: redis:7-alpine
    container_name: apex_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # ── FastAPI Backend ──────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: apex_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DATABASE_URL:          postgresql+asyncpg://apex_user:apex_pass@postgres:5432/apex_trading
      REDIS_URL:             redis://redis:6379
      JWT_SECRET:            ${JWT_SECRET}
      AIRTEL_CLIENT_ID:      ${AIRTEL_CLIENT_ID}
      AIRTEL_CLIENT_SECRET:  ${AIRTEL_CLIENT_SECRET}
      AIRTEL_WEBHOOK_SECRET: ${AIRTEL_WEBHOOK_SECRET}
      AIRTEL_CALLBACK_URL:   ${AIRTEL_CALLBACK_URL}
      TWELVE_DATA_API_KEY:   ${TWELVE_DATA_API_KEY}
      SMTP_HOST:             ${SMTP_HOST}
      SMTP_USER:             ${SMTP_USER}
      SMTP_PASS:             ${SMTP_PASS}
      FROM_EMAIL:            ${FROM_EMAIL}
      ENVIRONMENT:           production
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - model_data:/app/models

  # ── React Frontend ───────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: apex_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000
      NEXT_PUBLIC_WS_URL:  ws://backend:8000/ws

  # ── Nginx Reverse Proxy + SSL ────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: apex_nginx
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - certbot_data:/var/www/certbot

volumes:
  postgres_data:
  redis_data:
  model_data:
  certbot_data:
